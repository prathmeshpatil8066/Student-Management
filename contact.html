
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="site-header">
        <div class="container nav-wrap">
            <a class="logo" href="index.html">SMS Demo</a>

            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Contact Content -->
    <main class="container page-content">

        <h1>Contact Us</h1>

        <p>
            If you have any questions about our project,
            feel free to contact us.
        </p>

        <div class="contact-box">
            <p><strong>Email:</strong> demo@example.com</p>
            <p><strong>Phone:</strong> +91 00000 00000</p>
            <p><strong>Location:</strong> Pune, Maharashtra</p>
        </div>

        <h2>Send Us a Message</h2>

        <form>
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Your Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="message">Message</label>
            <textarea id="message" rows="5"
                placeholder="Write your message"></textarea>

            <button type="submit" class="button">
                Send Message
            </button>
        </form>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>© 2026 Student Management System</p>
        </div>
    </footer>

</body>
</html>
